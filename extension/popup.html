<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      margin-bottom: 12px;
    }
    .input-group {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    input {
      flex: 1;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #ffffff;
      padding: 6px 10px;
      font-size: 12px;
    }
    button {
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #0369a1;
    }
    .result-box {
      background: #1e293b;
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
      display: none;
    }
  </style>
</head>
<body>
  <h3>📈 Niveshak Copilot</h3>
  <div class="status-badge">🟢 Engine Connected: Localhost:8000</div>
  <p>Live Chart HUD active on Groww, Angel One & TradingView.</p>

  <div class="input-group">
    <input type="text" id="ticker-input" placeholder="e.g. RELIANCE, TCS" value="RELIANCE">
    <button id="scan-btn">Scan</button>
  </div>

  <div id="result" class="result-box"></div>

  <script src="popup.js"></script>
</body>
</html>
