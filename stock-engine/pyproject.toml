[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-engine"
version = "0.1.0"
description = "Multimodal Stock Intelligence Engine"
authors = [{name = "Aryan-Lade"}]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=10.0",
    "yfinance>=0.2",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "torch>=2.0",
    "optuna>=3.0",
    "mlflow>=2.0",
    "shap>=0.40",
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "apscheduler>=3.0",
    "fastapi>=0.95",
    "uvicorn>=0.22",
    "httpx>=0.24",
    "streamlit>=1.28",
    "plotly>=5.15",
    "matplotlib>=3.7",
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
    "rank-bm25>=0.2",
    "feedparser>=6.0",
    "growwapi>=0.1",
]
optional-dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "C90"]
ignore = []