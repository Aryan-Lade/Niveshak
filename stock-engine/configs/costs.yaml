# Indian Equities Transaction Cost Model (NSE Delivery / Cash Segment)
# Verified against official Groww & statutory charge structure

brokerage:
  flat_inr: 20.0        # INR 20 flat or percentage, whichever is lower
  percentage: 0.05      # 0.05% of turnover

stt_ctt:
  buy: 0.1              # 0.1% on delivery buy turnover
  sell: 0.1             # 0.1% on delivery sell turnover

exchange_transaction_charges:
  buy: 0.00325          # 0.00325% NSE transaction charge
  sell: 0.00325

sebi_turnover_fee:
  buy: 0.0001           # 0.0001% (Rs 10 per crore)
  sell: 0.0001

stamp_duty:
  buy: 0.015            # 0.015% stamp duty on buy side
  sell: 0.0

gst:
  rate: 0.18            # 18% GST on (brokerage + exchange + sebi fees)

dp_charge:
  sell: 13.5            # INR 13.50 flat DP charge per scrip on sell side
  buy: 0.0

slippage_bps:
  buy: 2.0              # 2 bps slippage on fill
  sell: 2.0

round_trip_cost_bps_fallback: 25